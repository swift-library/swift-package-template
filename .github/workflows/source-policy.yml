name: Source policy
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  policy:
    uses: swift-library/.github/.github/workflows/policy.yml@9aa78ca8d6346242460006178b9808114beee9f8
