name: CI
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    uses: swift-library/.github/.github/workflows/swift-package-ci.yml@c71c3ab6af8d85b68dff8f0536015cdbbb70cd20
