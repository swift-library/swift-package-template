name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing accepted version tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    uses: swift-library/.github/.github/workflows/swift-package-ci.yml@c71c3ab6af8d85b68dff8f0536015cdbbb70cd20
    with:
      ref: ${{ inputs.tag }}
  publish:
    needs: validate
    permissions:
      contents: write
      actions: read
    uses: swift-library/.github/.github/workflows/swift-package-release.yml@c71c3ab6af8d85b68dff8f0536015cdbbb70cd20
    with:
      tag: ${{ inputs.tag }}
      accepted_commit: ${{ needs.validate.outputs.commit }}
